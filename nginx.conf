server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        # No CORS headers here on purpose: / and /api/ are served from
        # this same nginx block, so browser requests from the dashboard
        # itself are same-origin and never trigger CORS at all. The
        # previous wildcard (Access-Control-Allow-Origin *) only made a
        # stolen bearer token replayable from any origin — it enabled
        # nothing the packaged deployment uses. If you're running the
        # frontend and API on different origins (custom reverse proxy,
        # local dev server), set CORS_ALLOWED_ORIGINS on the API
        # container instead — don't re-add headers here, since having
        # both nginx and FastAPI set Access-Control-Allow-Origin
        # produces duplicate header values that browsers reject outright.
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
