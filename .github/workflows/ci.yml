name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - release
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Shared Python lint
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-python-ci.yml@d89e9db45ba77fd32d95da02620476eada9c01cd
    with:
      python-version: '3.12'
      install-command: python -m pip install ruff
      lint-command: ruff check .
      test-command: python -m compileall -q .

  lint-and-build:
    name: Lint and Test Build
    runs-on: ubuntu-latest
    permissions:
      contents: read          # actions/checkout
      security-events: write  # upload Trivy SARIF results to the Security tab
                               # (note: PRs from forks never get this permission
                               # regardless of this block, by GitHub's own design —
                               # the SARIF upload step already has continue-on-error
                               # for exactly that case)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Python version from Dockerfile
        id: pyver
        run: |
          VERSION=$(grep -oP '(?<=FROM python:)[0-9]+\.[0-9]+' Dockerfile)
          echo "Dockerfile uses Python $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          cache: "pip"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # provenance/sbom disabled — this build is scan-only (never
      # pushed), and buildx's attestation behavior with load:true has
      # proven inconsistent across versions in practice, causing Trivy
      # to sometimes prefer a stale attached SBOM over its own direct
      # filesystem scan. See docker-release.yml's equivalent step for
      # the full writeup of the exact symptom this fixes.
      - name: Test Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: hvac-dashboard:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: don't fail on CVEs Debian hasn't shipped a
      # patch for yet — most base-image OS-package vulnerabilities
      # fall in this bucket, and there's nothing we can do about them
      # until upstream releases a fix. Failing CI on unfixable CVEs
      # just blocks every build indefinitely for no actionable reason.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hvac-dashboard:ci-test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # Same gate as docker-release.yml, so CI fails before a release would.
      - name: Fail build on CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hvac-dashboard:ci-test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Test container starts
        run: |
          docker run -d --name hvac-test -p 8080:80 hvac-dashboard:ci-test

          # A fixed sleep here was either too short (occasional flakes
          # on a loaded runner — /health and / are served directly by
          # nginx and come up instantly, but /api/ needs the Python
          # backend to actually finish starting and bind to port 8081,
          # which doesn't happen on the same timeline) or, if bumped
          # up to "safe", wastes real CI time on every single run even
          # when the app is ready in 2 seconds. Poll instead: proceed
          # as soon as it's actually ready, fail fast with real
          # diagnostics if it never becomes ready at all.
          echo "Waiting for the app to become ready..."
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/ >/dev/null 2>&1; then
              READY=1
              echo "Ready after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "App did not become ready within 30s — container logs:"
            docker logs hvac-test
            exit 1
          fi

          curl -sf http://localhost:8080/health || exit 1
          curl -sf http://localhost:8080/ | grep -i "HVAC" || exit 1
          curl -sf http://localhost:8080/api/ | grep -i "ok" || exit 1
          echo "All checks passed"
          docker stop hvac-test

      - name: Validate nginx config
        run: |
          docker run --rm -v ${{ github.workspace }}/nginx.conf:/etc/nginx/conf.d/hvac.conf:ro nginx:alpine nginx -t
