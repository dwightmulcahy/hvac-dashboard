name: Tests

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

jobs:
  test:
    name: Run pytest + JS unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pyflakes (fast syntax/unused-var check)
        run: pip install pyflakes && pyflakes api.py auth.py state.py models.py worker.py maintenance_logic.py notify.py routers/*.py

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=api --cov=auth --cov=state --cov=models --cov=worker \
            --cov=maintenance_logic --cov=notify --cov=routers \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Check hvac-dashboard.html JS syntax
        run: |
          python3 -c "
          import subprocess
          html = open('frontend/hvac-dashboard.html').read()
          start = html.index('<script>') + 8
          end = html.rindex('</script>')
          open('/tmp/check_script.js', 'w').write(html[start:end])
          r = subprocess.run(['node', '--check', '/tmp/check_script.js'], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stderr)
              exit(1)
          print('Dashboard JS syntax: CLEAN')
          "

      - name: Check kiosk.html JS syntax
        run: |
          python3 -c "
          import subprocess
          html = open('frontend/kiosk.html').read()
          start = html.index('<script>') + 8
          end = html.rindex('</script>')
          open('/tmp/check_kiosk.js', 'w').write(html[start:end])
          r = subprocess.run(['node', '--check', '/tmp/check_kiosk.js'], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stderr)
              exit(1)
          print('Kiosk JS syntax: CLEAN')
          "

      - name: Install JS test dependencies
        run: npm ci

      - name: Run JS unit tests (dashboard + kiosk)
        run: node --test tests-js/*.test.js
