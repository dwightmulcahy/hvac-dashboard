name: Tests

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]
  workflow_dispatch:
  workflow_call:              # reused by docker-release.yml

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run pytest + JS unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Python version from Dockerfile
        id: pyver
        run: |
          VERSION=$(grep -oP '(?<=FROM python:)[0-9]+\.[0-9]+' Dockerfile)
          echo "Dockerfile uses Python $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff (lint — includes pyflakes' checks plus more)
        run: ruff check .

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=api --cov=auth --cov=state --cov=models --cov=worker \
            --cov=maintenance_logic --cov=notify --cov=logging_config --cov=routers \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Check hvac-dashboard.html JS syntax
        run: |
          python3 -c "
          import subprocess
          html = open('frontend/hvac-dashboard.html').read()
          start = html.index('<script>') + 8
          end = html.rindex('</script>')
          open('/tmp/check_script.js', 'w').write(html[start:end])
          r = subprocess.run(['node', '--check', '/tmp/check_script.js'], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stderr)
              exit(1)
          print('Dashboard JS syntax: CLEAN')
          "

      - name: Check kiosk.html JS syntax
        run: |
          python3 -c "
          import subprocess
          html = open('frontend/kiosk.html').read()
          start = html.index('<script>') + 8
          end = html.rindex('</script>')
          open('/tmp/check_kiosk.js', 'w').write(html[start:end])
          r = subprocess.run(['node', '--check', '/tmp/check_kiosk.js'], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stderr)
              exit(1)
          print('Kiosk JS syntax: CLEAN')
          "

      - name: Install JS test dependencies
        run: npm ci

      - name: Lint JS test files (eslint)
        run: npm run lint:js

#      - name: Check JS test file formatting (prettier)
#        run: npm run format:js:check

      - name: Run JS unit tests (dashboard + kiosk)
        run: node --test tests-js/*.test.js
