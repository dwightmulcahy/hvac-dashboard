name: Build and Push to Docker Hub

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never abort a half-published release

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on release
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.meta.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Release process (README) tags commits on the `release` branch.
      - name: Tagged commit must be reachable from origin/release
        run: |
          git fetch origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on release"; exit 1
          fi
      # `latest`, X and X.Y only move for a non-prerelease tag that is the
      # highest semver — a backport or -rc tag must not overwrite them.
      - id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          highest="$(git tag --list | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [[ "$version" != *-* && "$version" == "$highest" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Full test suite
    needs: verify
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build-and-push:
    name: Build and Push Docker Image
    needs: [verify, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # actions/checkout, and creating the GitHub Release below
      security-events: write  # upload Trivy SARIF results to the Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the full commit + tag history to build the
          # changelog — the default shallow checkout (depth 1) only has
          # the single commit this tag points at, which would produce
          # an empty changelog every time
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hvac-dashboard
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.is_latest == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.verify.outputs.is_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_latest == 'true' }}

      # Buildx can't `load:true` a multi-platform image locally, so
      # this release gate builds a single-platform (amd64) image
      # first purely to scan and gate on. The layer cache is shared
      # with the real multi-arch build below, so this doesn't roughly
      # double the total build time — most layers are reused.
      #
      # provenance/sbom are explicitly disabled here (and ONLY here —
      # the real published build below keeps them, since attestations
      # are a genuine supply-chain security feature worth having on
      # what actually ships). Docker's docs say attestations aren't
      # added when load:true is used, but buildx's actual behavior
      # around this has been inconsistent across versions in practice
      # (see docker/buildx#1608, docker/build-push-action#795) — we
      # hit exactly this symptom: Trivy warned "Third-party SBOM may
      # lead to inaccurate vulnerability detection" and then reported
      # stale package versions (msgpack 1.1.2, setuptools 70.3.0) even
      # though the actual installed files in the image were already
      # correctly upgraded (msgpack 1.2.1, setuptools 84.0.0, verified
      # in Trivy's own per-file breakdown of the same scan). Disabling
      # both explicitly removes whatever buildx was attaching that
      # Trivy was preferring over its own filesystem scan.
      - name: Build image for security scan (amd64 only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: hvac-dashboard:release-scan
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: don't fail on CVEs Debian hasn't shipped a
      # patch for yet — most base-image OS-package vulnerabilities
      # fall in this bucket, and there's nothing we can do about them
      # until upstream releases a fix. Failing on unfixable CVEs just
      # blocks every release indefinitely for no actionable reason.
      - name: Scan release image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hvac-dashboard:release-scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # This is the actual release gate — CRITICAL or HIGH severity
      # findings block the push to Docker Hub. ci.yml applies the same
      # bar so a failing scan surfaces on push, not at release time.
      - name: Fail release on CRITICAL or HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hvac-dashboard:release-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only runs once the image above has actually built, scanned
      # clean, and pushed — a GitHub Release existing is meant to mean
      # "this version is really out there," so it shouldn't appear for
      # a tag whose build failed or got blocked by the vulnerability
      # gate earlier in this job.
      #
      # cliff.toml's grouping (Features/Bug Fixes/Dependencies/etc.)
      # was built from — and tested against — this repo's actual
      # commit history, not left at git-cliff's generic defaults; see
      # that file's own header comment for specifics (e.g. why it
      # needs to know about a custom `improvement:` commit type this
      # project uses alongside the standard conventional-commit ones).
      - name: Generate conventional release notes
        run: |
          python3 scripts/standard_release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --project-name "HVAC Dashboard" \
            --image "dwightmulcahy/hvac-dashboard" \
            --output release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          # semver pre-release suffixes (v1.15.0-rc.1, -beta.2, etc.)
          # get flagged as a GitHub prerelease automatically; anything
          # else is a normal release
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
