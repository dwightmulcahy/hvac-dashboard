<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no">
<title>HVAC Kiosk</title>
<style>
:root{
  --bg:#12141a;--bg2:#181a20;--bg3:#1c2c42;
  --border:#262a33;--border2:#20222a;
  --text:#e8e9ec;--text2:#7a7f8a;--text3:#5b6270;--text4:#4a4e58;
  --cool:#3b82f6;--cool-bg:#1c2c42;
  --heat:#f59e0b;--heat-bg:#3a2c14;
  --auto:#2dd4bf;--auto-bg:#173c38;
  --off:#5b6270;--off-bg:#1b1d22;
  --err:#e24b4a;--ok:#22c55e;--warn:#f59e0b;
  --amber:#fbbf24;--orange:#fb923c;--violet:#a78bfa;--yellow:#facc15;
  --green:#4ade80;--teal:#2dd4bf;--gray:#4b5563;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif}
#app{width:800px;height:480px;background:var(--bg);position:relative;overflow:hidden;margin:0 auto}
button{font-family:inherit;background:transparent;border:0.5px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer}
button:active{opacity:0.7}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
#lock-screen{align-items:center;justify-content:center;padding:20px}
#screensaver{cursor:pointer}
#main-header{height:44px;flex-shrink:0;border-bottom:0.5px solid var(--border);align-items:center;display:flex;justify-content:space-between;padding:0 16px}
#sub-header{height:44px;flex-shrink:0;border-bottom:0.5px solid var(--border);align-items:center;display:none;padding:0 4px;cursor:pointer}
#grid-view{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;height:354px}
#grid-detail,#schedules-view,#devices-view{display:none;height:354px;padding:10px 20px;overflow:hidden}
#footer-stats{height:40px;display:grid;grid-template-columns:0.55fr 1.25fr 1.25fr 0.95fr;align-items:center;padding:0 20px;border-top:0.5px solid var(--border);flex-shrink:0}
.tile{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.stat-card{width:100%;background:var(--bg2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:row;align-items:center;gap:11px}
.icon{display:inline-flex;flex-shrink:0}
.footer-tappable{cursor:pointer}
#loading-banner{position:absolute;top:0;left:0;right:0;background:var(--err);color:#fff;font-size:11px;text-align:center;padding:3px;display:none;z-index:10}
</style>
</head>
<body>
<div id="app">

  <div id="loading-banner">Can't reach the server — retrying…</div>

  <div id="lock-screen" class="screen active">
    <span id="lock-clock" style="color:var(--text3);font-size:15px;margin-bottom:24px"></span>
    <span id="pin-label" style="color:#c7c9ce;font-size:14px;margin-bottom:14px">Enter PIN</span>
    <div id="pin-dots" style="display:flex;gap:14px;margin-bottom:26px"></div>
    <div id="keypad" style="display:grid;grid-template-columns:repeat(3,64px);gap:12px"></div>
  </div>

  <div id="screensaver" class="screen">
    <div id="saver-content" style="position:absolute;display:flex;flex-direction:column;align-items:center;transition:top 1.8s ease,left 1.8s ease">
      <span id="saver-clock" style="color:#3a3d45;font-size:72px;font-weight:500"></span>
      <span id="saver-sub" style="color:#2c2e35;font-size:15px;margin-top:12px"></span>
      <span style="color:#23252b;font-size:12px;margin-top:34px">tap to unlock</span>
    </div>
  </div>

  <div id="main-screen" class="screen">
    <div id="main-header">
      <span style="color:var(--text);font-size:15px;font-weight:500">All units</span>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="version-badge" style="color:var(--text3);font-size:11px"></span>
        <span id="header-clock" style="color:var(--text2);font-size:13px"></span>
        <span id="vacation-btn" class="icon" style="display:none;color:var(--text2);cursor:pointer" title="Toggle vacation mode"></span>
        <span id="maintenance-btn" class="icon" style="display:none;color:var(--text2);cursor:pointer" title="Maintenance reminders"></span>
        <span id="relock-btn" class="icon" style="color:var(--text2);cursor:pointer" aria-label="Lock panel"></span>
      </div>
    </div>
    <div id="sub-header">
      <div style="display:flex;align-items:center;gap:6px;padding:10px 16px;width:100%">
        <span id="sub-header-back-icon" class="icon" style="color:var(--text)"></span>
        <span style="color:var(--text);font-size:15px;font-weight:500">All units</span>
      </div>
    </div>
    <div id="grid-view"></div>
    <div id="grid-detail"></div>
    <div id="schedules-view"></div>
    <div id="devices-view"></div>
    <div id="maintenance-view"></div>
    <div id="idle-badge" style="display:none;color:var(--text4);font-size:10px;text-align:center;padding:3px 0"></div>
    <div id="footer-stats"></div>
  </div>

</div>

<script>
const API=window.location.origin+'/api';
const FETCH_TIMEOUT_MS=10000;
// Every network call in this file goes through here rather than raw
// fetchT() — a kiosk meant to run unattended for months shouldn't be
// able to get stuck indefinitely on one hung connection. AbortController
// forces the request to give up and fail cleanly after FETCH_TIMEOUT_MS
// instead of leaving a request (and whatever awaited it) hanging forever.
async function fetchT(url,opts){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),FETCH_TIMEOUT_MS);
  try{
    return await fetch(url,{...(opts||{}),signal:controller.signal});
  }finally{
    clearTimeout(timer);
  }
}
const MODE_COLOR={COOL:'var(--cool)',HEAT:'var(--heat)',AUTO:'var(--auto)',OFF:'var(--off)'};
const MODE_BG={COOL:'var(--cool-bg)',HEAT:'var(--heat-bg)',AUTO:'var(--auto-bg)',OFF:'var(--off-bg)'};
const MODES=['OFF','COOL','HEAT','AUTO'];
const DETAIL_IDLE_SECONDS=15;
const INFO_IDLE_SECONDS=30;
// 10 minutes, not the original 3 — 3 minutes meant a routine "check
// the panel, walk to the kitchen, come back" bounced straight to PIN
// entry, which is real friction for the same person continuing the
// same task. 10 minutes still catches a genuinely-abandoned unlocked
// session (the actual security purpose here) without punishing normal
// household movement in between.
const SCREENSAVER_IDLE_SECONDS=600;
const POLL_INTERVAL_MS=12000;

let token=null,currentUser=null;
let devices=[],settings={},schedules=[],rootInfo={},usageToday={},maintenanceItems=[];
let entered='',failedAttempts=0,lockoutUntil=0,lockoutTimer=null;
let idleTimer=null,idleCountdownTimer=null,mainIdleTimer=null,pollTimer=null,clockTimer=null,saverMoveTimer=null;
let openDeviceHost=null,currentSub='grid';

// ── Self-contained icons ─────────────────────────────────────
// Inline SVG, not an external icon-font CDN. The kiosk previously
// depended on a live fetch to cdnjs.cloudflare.com for every icon in
// the UI (back arrow, stat-card icons, everything) — on a device that
// may sit on a restricted or offline home network, that CDN call can
// silently fail, and every icon in the app just doesn't render. A
// kiosk should be at least as self-contained as the rest of this
// project (nothing else here depends on an external CDN for core
// function), so these are bundled directly in the file instead.
const ICON_PATHS={
  'chevron-left':'<path d="M15 6l-6 6l6 6"/>',
  'lock-open':'<rect x="6" y="11" width="12" height="9" rx="1.5"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 6.6-1.6"/>',
  'lock':'<rect x="6" y="11" width="12" height="9" rx="1.5"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/>',
  'clock':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  'sun':'<circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"/>',
  'shield-check':'<path d="M12 3l7 3v6c0 5-3.5 8-7 9c-3.5-1-7-4-7-9V6l7-3z"/><path d="M9.3 12.2l1.8 1.8l3.4-3.8"/>',
  'bolt':'<path d="M13 3L5 14h6l-1 7l8-11h-6l1-7z"/>',
  'dollar':'<path d="M12 3v18M16 7.2c0-1.8-2-3.2-4.5-3.2S7 5.4 7 7.2s2 2.8 4.5 3.2s4.5 1.4 4.5 3.2s-2 3.2-4.5 3.2S7 15.4 7 13.6"/>',
  'bell':'<path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0"/>',
  'eye':'<path d="M2 12s3.5-6 10-6s10 6 10 6s-3.5 6-10 6s-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/>',
  'backspace':'<path d="M4 12l6-7h10v14H10l-6-7z"/><path d="M13 9l4 6M17 9l-4 6"/>',
  'calendar':'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  'list':'<rect x="4" y="4" width="16" height="4.5" rx="1"/><rect x="4" y="10.5" width="16" height="4.5" rx="1"/><rect x="4" y="17" width="16" height="3" rx="1"/>',
  'wifi-off':'<path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 5-1.3M5 12.5a10 10 0 0 1 3-1.9M19 12.5a10 10 0 0 0 -2.3-1.7M12 19v.01"/>',
  'suitcase':'<rect x="4" y="8" width="16" height="12" rx="1.5"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M4 13h16"/>',
  'wrench':'<path d="M14.7 6.3a4 4 0 0 0-5.4 4.9L4 16.5V20h3.5l5.3-5.3a4 4 0 0 0 4.9-5.4l-2.8 2.8-2-2z"/>'
};
function svgIcon(name,size){
  size=size||18;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||''}</svg>`;
}
function iconSpan(name,size,color,extraStyle){
  return `<span class="icon" style="color:${color||'currentColor'};${extraStyle||''}">${svgIcon(name,size)}</span>`;
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function fmtClock(){
  return new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function tickClock(){
  const t=fmtClock();
  const a=document.getElementById('lock-clock');if(a)a.textContent=t;
  const b=document.getElementById('saver-clock');if(b)b.textContent=t;
  const c=document.getElementById('header-clock');
  if(c)c.textContent=`${t} · outdoor ${fmtOutdoorShort()}`;
}

function safeFloat(v){const n=parseFloat(v);return isNaN(n)?null:n;}
function toF(c){return c!=null?Math.round(c*9/5+32):null;}
// Every temperature in the kiosk shows both units — compact form for
// tight spaces (tiles, stat cards), spelled-out form for the one
// large hero number on the detail screen.
function fmtCVal(n){
  if(n==null)return null;
  const snapped=Math.round(n*2)/2; // display precision matches the 0.5°C step
  return Number.isInteger(snapped)?String(snapped):snapped.toFixed(1);
}
function fmtTempCompact(c){
  const n=safeFloat(c);
  if(n==null)return'—';
  return `${fmtCVal(n)}°/${toF(n)}°`;
}
function fmtTempFull(c){
  const n=safeFloat(c);
  if(n==null)return{c:'—',f:''};
  return{c:`${fmtCVal(n)}°C`,f:`${toF(n)}°F`};
}
function fmtOutdoorShort(){
  const vals=devices.map(d=>d.state?.outdoor_temp).filter(v=>v!=null);
  if(!vals.length)return'—';
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  return fmtTempCompact(avg);
}
function fmtOnTime(m){
  if(!m||m<=0)return'';
  if(m<60)return`${Math.round(m)}m`;
  const h=Math.floor(m/60),r=Math.round(m%60);
  return r?`${h}h ${r}m`:`${h}h`;
}
// Mirrors state.py's _today() — datetime.date.today().isoformat().
// Deliberately uses local date components (getFullYear/getMonth/
// getDate), not toISOString() (which converts to UTC first): the
// server's "today" respects the container's configured timezone
// (see docker-compose.yml's TZ), and a kiosk physically in the same
// location should be on the same local clock. Using UTC here could
// silently pick the wrong day near midnight.
function localDateStr(d){
  d=d||new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ── Cost / watts estimation — mirrors the formulas in
// hvac-dashboard.html's TESTABLE:rates and TESTABLE:watts-temp
// regions. Prefers the device's actual reported power draw when the
// sensor supports it, falling back to the same load-factor estimate.
function seerToEer(seer){return(seer||20)*0.875;}
function maxWatts(btu,seer){return Math.round(btu/seerToEer(seer));}
function estWatts(d){
  const s=d.state||{};
  if(s.actual_power_watts!=null)return s.actual_power_watts;
  if(!s.mode||s.mode==='OFF'||s.mode==='FAN_ONLY')return 0;
  if(!d.btu)return null;
  const indoor=safeFloat(s.current_temperature);
  const target=safeFloat(s.target_temperature);
  const outdoor=safeFloat(s.outdoor_temp);
  if(indoor==null||target==null)return null;
  const deltaT=Math.abs(indoor-target);
  const outdoorPenalty=outdoor!=null&&s.mode!=='HEAT'?Math.max(0,(outdoor-25)/20):0;
  const loadFactor=Math.min(1,0.2+(deltaT/8)*0.8+outdoorPenalty*0.3);
  return Math.round(maxWatts(d.btu,d.seer)*loadFactor);
}
function effectiveRateUsd(){
  const r=settings||{};
  if(!r.tiered)return r.flatRate||0.14;
  const kwh=r.monthlyKwh||400;
  const xr=r.exchangeRate||455;
  const tiers=r.tiers||[{upTo:999999,colonesPerKwh:70}];
  for(const t of tiers){if(kwh<=t.upTo)return t.colonesPerKwh/xr;}
  return tiers[tiers.length-1].colonesPerKwh/xr;
}
function estCostDay(watts){
  if(!watts)return 0;
  return(watts/1000)*(settings.dailyHrs||8)*effectiveRateUsd();
}

// ── PIN entry ────────────────────────────────────────────────

function renderKeypad(){
  const keys=['1','2','3','4','5','6','7','8','9','','0','back'];
  document.getElementById('keypad').innerHTML=keys.map(k=>{
    if(k==='')return'<span></span>';
    if(k==='back')return `<button data-key="back" style="width:64px;height:52px;border-radius:8px;padding:0;display:flex;align-items:center;justify-content:center">${svgIcon('backspace',18)}</button>`;
    return `<button data-key="${k}" style="width:64px;height:52px;border-radius:8px;font-size:19px;font-weight:500;padding:0">${k}</button>`;
  }).join('');
  document.getElementById('keypad').querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>onKey(b.dataset.key)));
}

function renderDots(err){
  const el=document.getElementById('pin-dots');
  if(!el)return;
  el.innerHTML=[0,1,2,3].map(i=>`<span style="width:12px;height:12px;border-radius:50%;display:inline-block;background:${i<entered.length?(err?'var(--err)':'var(--cool)'):'transparent'};border:1.5px solid ${err?'var(--err)':(i<entered.length?'var(--cool)':'#3a3d45')}"></span>`).join('');
}

function onKey(k){
  if(Date.now()<lockoutUntil)return;
  if(k==='back'){entered=entered.slice(0,-1);renderDots();return;}
  if(entered.length>=4)return;
  entered+=k;
  renderDots();
  if(entered.length===4)attemptPinLogin();
}

async function attemptPinLogin(){
  const pin=entered;
  try{
    const r=await fetchT(`${API}/auth/login-pin`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin})
    });
    const data=await r.json();
    if(r.status===429){
      const mins=(data.detail.match(/(\d+) minute/)||[])[1]||'a few';
      startLockout(mins*60);
      return;
    }
    if(!r.ok){
      renderDots(true);
      document.getElementById('pin-label').textContent=data.detail||'Wrong PIN';
      document.getElementById('pin-label').style.color='var(--err)';
      setTimeout(()=>{entered='';renderDots();document.getElementById('pin-label').textContent='Enter PIN';document.getElementById('pin-label').style.color='#c7c9ce';},900);
      return;
    }
    token=data.token;
    currentUser={username:data.username,role:data.role};
    entered='';
    unlock();
  }catch(e){
    entered='';
    document.getElementById('pin-label').textContent='Can\'t reach server';
    document.getElementById('pin-label').style.color='var(--err)';
  }
}

function startLockout(seconds){
  entered='';
  lockoutUntil=Date.now()+seconds*1000;
  document.getElementById('keypad').style.opacity='0.3';
  document.getElementById('pin-dots').style.display='none';
  const label=document.getElementById('pin-label');
  label.style.color='var(--err)';
  clearInterval(lockoutTimer);
  const tick=()=>{
    const remaining=Math.max(0,Math.ceil((lockoutUntil-Date.now())/1000));
    const mm=String(Math.floor(remaining/60)).padStart(2,'0');
    const ss=String(remaining%60).padStart(2,'0');
    label.textContent=`Too many attempts — ${mm}:${ss}`;
    if(remaining<=0){
      clearInterval(lockoutTimer);
      document.getElementById('keypad').style.opacity='1';
      document.getElementById('pin-dots').style.display='flex';
      label.textContent='Enter PIN';
      label.style.color='#c7c9ce';
      renderDots();
    }
  };
  tick();
  lockoutTimer=setInterval(tick,1000);
}

// ── Unlock / relock ────────────────────────────────────────────

async function unlock(){
  document.getElementById('relock-btn').innerHTML=svgIcon('lock-open',15);
  document.getElementById('sub-header-back-icon').innerHTML=svgIcon('chevron-left',20);
  const vacBtn=document.getElementById('vacation-btn');
  vacBtn.innerHTML=svgIcon('suitcase',16);
  vacBtn.style.display=currentUser.role!=='viewer'?'inline-flex':'none';
  document.getElementById('maintenance-btn').innerHTML=svgIcon('wrench',16);
  show('main-screen');
  showSub('grid');
  document.getElementById('version-badge').textContent=
    `${rootInfo.version||''} · ${currentUser.username} · ${currentUser.role.charAt(0).toUpperCase()+currentUser.role.slice(1)}`;
  await refreshAll();
  startPolling();
  armMainIdleTimer();
}

async function relock(){
  try{await fetchT(`${API}/auth/logout`,{method:'POST',headers:authHeaders()});}catch(e){}
  token=null;currentUser=null;openDeviceHost=null;
  stopPolling();
  clearIdleTimer();clearMainIdleTimer();
  clearInterval(saverMoveTimer);saverMoveTimer=null;
  show('lock-screen');
  renderKeypad();renderDots();
}

function authHeaders(){
  return token?{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}:{'Content-Type':'application/json'};
}

// ── Screensaver / idle timers ─────────────────────────────────
// The clock periodically jumps to a new random position rather than
// sitting in one spot — this panel is expected to run 24/7, and a
// static bright element in the exact same place for hours at a time
// is exactly the scenario that causes burn-in/image retention on an
// always-on display.
const SAVER_MOVE_INTERVAL_MS=20000;

function clearMainIdleTimer(){clearTimeout(mainIdleTimer);mainIdleTimer=null;}
function armMainIdleTimer(){
  clearMainIdleTimer();
  mainIdleTimer=setTimeout(showScreensaver,SCREENSAVER_IDLE_SECONDS*1000);
}
function moveSaverContent(){
  const el=document.getElementById('saver-content');
  const rect=el.getBoundingClientRect();
  const maxLeft=Math.max(0,800-rect.width);
  const maxTop=Math.max(0,480-rect.height);
  el.style.left=Math.floor(Math.random()*maxLeft)+'px';
  el.style.top=Math.floor(Math.random()*maxTop)+'px';
}
function showScreensaver(){
  clearIdleTimer();clearMainIdleTimer();stopPolling();
  const online=devices.filter(d=>!d._stale).length;
  document.getElementById('saver-sub').textContent=`outdoor ${fmtOutdoorShort()} · ${online}/${devices.length} online`;
  show('screensaver');
  moveSaverContent();
  clearInterval(saverMoveTimer);
  saverMoveTimer=setInterval(moveSaverContent,SAVER_MOVE_INTERVAL_MS);
}
document.getElementById('screensaver').addEventListener('click',relock);

function clearIdleTimer(){
  clearTimeout(idleTimer);clearInterval(idleCountdownTimer);
  idleTimer=null;idleCountdownTimer=null;
  const badge=document.getElementById('idle-badge');
  if(badge){badge.textContent='';badge.style.display='none';}
}
function armIdleTimer(seconds){
  clearIdleTimer();
  let remaining=seconds;
  const badge=document.getElementById('idle-badge');
  if(badge)badge.style.display='block';
  const tick=()=>{
    if(badge)badge.textContent=remaining<=5?`auto-return in ${remaining}s`:'';
    remaining--;
  };
  tick();
  idleCountdownTimer=setInterval(tick,1000);
  idleTimer=setTimeout(()=>showSub('grid'),seconds*1000);
}

function touch(){armMainIdleTimer();}

// ── Sub-navigation within main-screen ───────────────────────────
// 'grid' | 'detail' | 'schedules' | 'devices' — detail/schedules/
// devices all share the same generic sub-header ("‹ All units"),
// since all three just need to get back to the grid the same way.
// detail gets the short DETAIL_IDLE_SECONDS timeout since it's an
// active-control screen where any tap resets the clock anyway;
// schedules/devices are read-only browsing screens, so bouncing
// someone back to the grid mid-read after only 15s felt too fast —
// they get the longer INFO_IDLE_SECONDS instead.

function showSub(sub){
  currentSub=sub;
  const isGrid=sub==='grid';
  document.getElementById('main-header').style.display=isGrid?'flex':'none';
  document.getElementById('sub-header').style.display=isGrid?'none':'flex';
  document.getElementById('grid-view').style.display=isGrid?'grid':'none';
  document.getElementById('grid-detail').style.display=sub==='detail'?'block':'none';
  document.getElementById('schedules-view').style.display=sub==='schedules'?'block':'none';
  document.getElementById('devices-view').style.display=sub==='devices'?'block':'none';
  document.getElementById('maintenance-view').style.display=sub==='maintenance'?'block':'none';
  if(isGrid){clearIdleTimer();openDeviceHost=null;}
  else if(sub==='detail'){armIdleTimer(DETAIL_IDLE_SECONDS);}
  else{armIdleTimer(INFO_IDLE_SECONDS);}
}
document.getElementById('sub-header').addEventListener('click',()=>{showSub('grid');touch();});
document.getElementById('relock-btn').addEventListener('click',relock);

// ── Polling ────────────────────────────────────────────────────

function startPolling(){
  stopPolling();
  pollTimer=setInterval(refreshAll,POLL_INTERVAL_MS);
}
function stopPolling(){clearInterval(pollTimer);pollTimer=null;}

let refreshPromise=null;
let consecutiveFailures=0;
const STALE_THRESHOLD=2; // consecutive failed polls (~24s at the 12s interval) before flagging data as stale

function refreshAll(){
  // Coalesce concurrent calls into the same in-flight request instead
  // of firing overlapping ones — e.g. a periodic poll tick landing at
  // the same moment as a post-command refresh. Matters more here than
  // it would on a page someone's actively watching, since this is
  // meant to poll unattended every 12s for months at a time.
  if(refreshPromise)return refreshPromise;
  refreshPromise=_refreshAllImpl().finally(()=>{refreshPromise=null;});
  return refreshPromise;
}

async function _refreshAllImpl(){
  try{
    if(!rootInfo.version){
      try{const rr=await fetchT(`${API}/`);rootInfo=await rr.json();
        document.getElementById('version-badge').textContent=
          `${rootInfo.version||''} · ${currentUser.username} · ${currentUser.role.charAt(0).toUpperCase()+currentUser.role.slice(1)}`;
      }catch(e){}
    }
    const [devRes,setRes,schRes,maintRes]=await Promise.all([
      fetchT(`${API}/devices`,{headers:authHeaders()}),
      fetchT(`${API}/settings`,{headers:authHeaders()}),
      fetchT(`${API}/schedules`,{headers:authHeaders()}),
      fetchT(`${API}/maintenance`,{headers:authHeaders()})
    ]);
    if(devRes.status===401){relock();return;}
    const devData=await devRes.json();
    devices=devData.devices||[];
    settings=await setRes.json();
    schedules=(await schRes.json()).schedules||[];
    try{maintenanceItems=(await maintRes.json()).maintenance||[];}catch(e){}
    try{
      const ur=await fetchT(`${API}/usage/summary?month=${localDateStr()}`,{headers:authHeaders()});
      const ud=await ur.json();
      usageToday={};
      (ud.devices||[]).forEach(d=>{usageToday[d.host]=d.runtime_hours*60;});
    }catch(e){}
    consecutiveFailures=0;
    document.getElementById('loading-banner').style.display='none';
    setStaleIndicator(false);
    renderGrid();
    renderVacationBtn();
    renderMaintenanceBtn();
    renderFooter();
    if(currentSub==='detail'&&openDeviceHost)renderDetail(openDeviceHost);
    if(currentSub==='schedules')renderSchedulesView();
    if(currentSub==='devices')renderDevicesView();
    if(currentSub==='maintenance')renderMaintenanceView();
  }catch(e){
    consecutiveFailures++;
    if(consecutiveFailures>=STALE_THRESHOLD){
      document.getElementById('loading-banner').style.display='block';
      setStaleIndicator(true);
    }
  }
}

// Dims the currently-visible content once data has been stale for
// STALE_THRESHOLD polls in a row — the "can't reach server" banner is
// a single thin line that's easy to miss from across a room; a
// visibly dimmed screen is much harder to mistake for "everything's
// fine" when it isn't.
function setStaleIndicator(isStale){
  const opacity=isStale?'0.4':'1';
  document.getElementById('grid-view').style.opacity=opacity;
  document.getElementById('grid-detail').style.opacity=opacity;
  document.getElementById('schedules-view').style.opacity=opacity;
  document.getElementById('devices-view').style.opacity=opacity;
  document.getElementById('footer-stats').style.opacity=isStale?'0.5':'1';
}

// Visible to every role (unlike vacation) — knowing "the filter needs

function renderGrid(){

  return{html:`<span style="display:inline-flex;align-items:flex-end;height:22px">${bars}</span>`,color,label:`${Math.round(dbm)} dBm`};

// ── Optimistic control state ──────────────────────────────────
// Tapping +/-, a mode button, or beeper previously did nothing
// visible until a full round trip (send command -> refetch devices)
// completed — on a touchscreen that reads as laggy, and rapid +/-
// taps each fired their own separate command instead of coalescing
// into one. pendingHost/pendingTarget/pendingMode/pendingBeeper track
// a not-yet-confirmed local change so the UI updates instantly; while
// one is set, renderDetail() shows it instead of the (possibly
// stale-relative-to-this-tap) server value, so a periodic poll firing
// mid-adjustment can't make the display flicker back to the old
// number. Temp taps are also debounced — five quick taps send one
// command with the final value, not five.
let pendingHost=null,pendingTarget=null,pendingMode=null,pendingBeeper=null;
let tempDebounceTimer=null;

function renderDetail(host){
  const d=devices.find(x=>x.host===host);
  if(!d){showSub('grid');return;}
  const s=d.state||{};
  const isPending=pendingHost===host;
  const mode=(isPending&&pendingMode!=null)?pendingMode:(s.mode||'OFF');
  const tgt=(isPending&&pendingTarget!=null)?pendingTarget:safeFloat(s.target_temperature);
  const tgtFmt=fmtTempFull(tgt);
  const canControl=currentUser.role!=='viewer';
  const running=mode!=='OFF';
  const watts=estWatts(d);
  const costHr=(watts/1000*effectiveRateUsd()).toFixed(2);
  const GRAY='var(--gray)';
  const outdoor=safeFloat(s.outdoor_temp);
  const beeperOn=(isPending&&pendingBeeper!=null)?pendingBeeper:(d.beeper==='ON');
  // A locked device's target gets unconditionally restored by the
  // worker on its next poll, regardless of what sent the change —
  // including the kiosk itself. Letting someone tap +/-, see it
  // briefly "work", then have it silently revert a poll cycle later
  // would look like a bug. Disabling the buttons (not just graying
  // them) is the honest behavior here.
  const locked=!!d.lock_temp;
  const tempBtnStyle=(extra)=>`width:44px;height:44px;border-radius:50%;font-size:20px;padding:0;${locked?`color:${GRAY};border-color:var(--border);cursor:default;`:''}${extra||''}`;

  const el=document.getElementById('grid-detail');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="color:var(--text);font-size:17px;font-weight:500">${d.name}</span>
      <span style="color:${MODE_COLOR[mode]};font-size:13px;font-weight:500">${mode}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:${canControl?'16px':'0'};margin:2px 0 2px">
      ${canControl?`<button data-act="down" style="${tempBtnStyle()}">−</button>`:''}
      <div style="min-width:220px;text-align:center">
        <span style="color:var(--text);font-size:52px;font-weight:500">${tgtFmt.c}</span>
        <span style="color:var(--text2);font-size:20px;margin-left:8px">${tgtFmt.f}</span>
      </div>
      ${canControl?`<button data-act="up" style="${tempBtnStyle()}">+</button>`:''}
      ${canControl?`<button data-act="beeper" title="Toggle beeper" aria-label="Beeper is ${beeperOn?'on':'off'}, tap to toggle" style="width:38px;height:38px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;color:${beeperOn?'var(--auto)':'var(--text2)'};border-color:${beeperOn?'var(--auto)':'var(--border)'}">${iconSpan('bell',17)}</button>`:''}
      ${locked?`<span class="icon" title="Locked at ${fmtTempCompact(d.locked_target_temp)}" aria-label="Temperature locked at ${fmtTempCompact(d.locked_target_temp)}" style="width:38px;height:38px;border-radius:50%;border:0.5px solid var(--violet);display:flex;align-items:center;justify-content:center;color:var(--violet)">${svgIcon('lock',17)}</span>`:''}
    </div>
    ${canControl?`<div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px">
      ${MODES.map(m=>`<button data-mode="${m}" style="flex:1;max-width:96px;padding:7px 4px;border-radius:6px;background:${m===mode?MODE_BG[m]:'transparent'};border:0.5px solid ${m===mode?MODE_COLOR[m]:'var(--border)'};color:${m===mode?MODE_COLOR[m]:'var(--text2)'};font-size:11px;font-weight:500">${m}</button>`).join('')}
    </div>`:`<div style="color:var(--text3);font-size:11px;text-align:center;margin:4px 0 8px">${iconSpan('eye',12,'currentColor','vertical-align:-1px;margin-right:4px')}View only — sign in as operator to control</div>`}
    <div style="height:1px;background:var(--border2);margin:2px 0 8px"></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      ${statCard('clock',fmtOnTime(usageToday[d.host])||'Off','ON TODAY',running?'var(--amber)':GRAY)}
      ${statCard('sun',outdoor!=null?fmtTempCompact(outdoor):'—','OUTDOOR','var(--orange)')}
      ${statCard('shield-check',d.max_temp!=null?fmtTempCompact(d.max_temp):'—','GUARD',d._max_temp_active?'var(--err)':GRAY)}
      ${statCard('bolt',running&&watts!=null?watts+'W':'0W','POWER',running?'var(--yellow)':GRAY)}
      ${statCard('dollar',running&&watts?'$'+costHr+'/hr':'—','COST',running?'var(--green)':GRAY)}
      ${wifiStatCard(s.wifi_signal)}
    </div>
    <div style="color:var(--text4);font-size:10px;text-align:center;margin-top:8px">${d.host} · ESPHome ${d._firmware_version||'—'}</div>
  `;
  if(canControl){
    if(!locked){
      el.querySelector('[data-act="up"]').addEventListener('click',()=>adjustTemp(host,1));
      el.querySelector('[data-act="down"]').addEventListener('click',()=>adjustTemp(host,-1));
    }
    el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(host,b.dataset.mode)));
    el.querySelector('[data-act="beeper"]').addEventListener('click',()=>toggleBeeperOptimistic(host,!beeperOn));
  }
}

async function sendCmd(host,params){
  touch();armIdleTimer(DETAIL_IDLE_SECONDS);
  try{
    await fetchT(`${API}/devices/${encodeURIComponent(host)}/cmd`,{
      method:'POST',headers:authHeaders(),body:JSON.stringify({params})
    });
  }catch(e){}
  await refreshAll();
}

function adjustTemp(host,delta){
  const d=devices.find(x=>x.host===host);
  if(!d||!d.state)return;
  const step=safeFloat(d.state.step)||0.5;
  const base=(pendingHost===host&&pendingTarget!=null)?pendingTarget:(safeFloat(d.state.target_temperature)||22);
  const minT=safeFloat(d.state.min_temp)||17;
  const maxT=safeFloat(d.state.max_temp)||30;
  const next=Math.round((Math.min(maxT,Math.max(minT,base+delta*step)))/step)*step;

  pendingHost=host;
  pendingTarget=next;
  touch();armIdleTimer(DETAIL_IDLE_SECONDS);
  renderDetail(host);

  clearTimeout(tempDebounceTimer);
  tempDebounceTimer=setTimeout(async()=>{
    await sendCmd(host,{target_temperature:next});
    if(pendingHost===host&&pendingTarget===next){pendingHost=null;pendingTarget=null;}
  },600);
}

function setMode(host,mode){
  pendingHost=host;
  pendingMode=mode;
  touch();armIdleTimer(DETAIL_IDLE_SECONDS);
  renderDetail(host);
  sendCmd(host,{mode}).then(()=>{
    if(pendingHost===host&&pendingMode===mode){pendingHost=null;pendingMode=null;}
  });
}

function toggleBeeperOptimistic(host,turnOn){
  pendingHost=host;
  pendingBeeper=turnOn;
  touch();armIdleTimer(DETAIL_IDLE_SECONDS);
  renderDetail(host);
  toggleBeeper(host,turnOn).then(()=>{
    if(pendingHost===host&&pendingBeeper===turnOn){pendingHost=null;pendingBeeper=null;}
  });
}

async function toggleBeeper(host,turnOn){
  try{
    await fetchT(`${API}/devices/${encodeURIComponent(host)}/beeper/${turnOn?'on':'off'}`,{
      method:'POST',headers:authHeaders()
    });
  }catch(e){}
  await refreshAll();
}

// ── Schedules view (tap NEXT in footer) ─────────────────────────

const DAY_ABBR=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDays(days){
  if(!days||!days.length)return'—';
  const sorted=[...days].sort();
  const key=sorted.join(',');
  if(key==='0,1,2,3,4,5,6')return'Every day';
  if(key==='1,2,3,4,5')return'Weekdays';
  if(key==='0,6')return'Weekends';
  return sorted.map(d=>DAY_ABBR[d]).join(', ');
}

function nextOccurrenceOf(sch,now,timeField){
  const t=sch[timeField];
  if(!t)return null;
  const [hh,mm]=t.split(':').map(Number);
  const days=sch.days||[0,1,2,3,4,5,6];
  // An overnight end_time (e.g. start 20:45, end 06:45) technically
  // belongs to the day the schedule *started*, not the calendar day
  // it lands on after crossing midnight — same distinction worker.py
  // makes server-side for the real firing logic. Getting this wrong
  // here doesn't just look wrong, it can send the countdown a full
  // week into the future for a schedule that's actually about to end.
  const isOvernightEnd=timeField==='end_time'&&sch.time&&sch.end_time<sch.time;
  for(let dOff=0;dOff<8;dOff++){
    const cand=new Date(now);
    cand.setDate(now.getDate()+dOff);
    cand.setHours(hh,mm,0,0);
    const matchDay=isOvernightEnd?(cand.getDay()+6)%7:cand.getDay();
    if(!days.includes(matchDay))continue;
    if(cand<=now)continue;
    return cand;
  }
  return null;
}
function nextOccurrence(sch,now){return nextOccurrenceOf(sch,now,'time');}

// A schedule with an end_time is really two events (turns on, later
// auto-offs) — whichever comes first is the one worth showing. Once
// end_time is visible in the UI at all, showing "starts in 8h" for a
// schedule that's actually mid-run and about to auto-off in 20
// minutes would read as simply wrong, not just incomplete.
function nextRelevantEvent(sch,now){
  const start=nextOccurrenceOf(sch,now,'time');
  const end=sch.end_time?nextOccurrenceOf(sch,now,'end_time'):null;
  if(end&&(!start||end<start))return{when:end,label:'ends'};
  if(start)return{when:start,label:'starts'};
  return null;
}

function nextScheduleText(){
  const now=new Date();
  let nearest=null,nearestMs=Infinity;
  schedules.filter(s=>s.enabled).forEach(s=>{
    const ev=nextRelevantEvent(s,now);
    if(!ev)return;
    const ms=ev.when-now;
    if(ms<nearestMs){nearestMs=ms;nearest=s;}
  });
  if(!nearest)return'—';
  return `${nearest.device_name} @ ${nearest.time}`;
}

function fmtCountdown(ms){
  const mins=Math.round(ms/60000);
  const h=Math.floor(mins/60),m=mins%60;
  return h>0?`in ${h}h ${m}m`:`in ${m}m`;
}

function renderSchedulesView(){
  document.querySelector('#sub-header span:last-child').textContent='Schedules';
  const el=document.getElementById('schedules-view');
  const now=new Date();
  const upcoming=schedules
    .filter(s=>s.enabled)
    .map(s=>({s,event:nextRelevantEvent(s,now)}))
    .filter(x=>x.event)
    .sort((a,b)=>a.event.when-b.event.when);

  if(!upcoming.length){
    el.innerHTML='<div style="color:var(--text2);font-size:15px;text-align:center;margin-top:40px">No enabled schedules</div>';
    return;
  }

  el.innerHTML=`<div style="max-width:680px;margin:0 auto;width:100%;max-height:340px;overflow:hidden">
    ${upcoming.slice(0,5).map(({s,event})=>{
      const modeColor=s.mode?MODE_COLOR[s.mode]||'var(--text2)':'var(--text2)';
      const action=s.power==='off'?'Off':(s.mode?`${s.mode}${s.temp!=null?' '+fmtTempCompact(s.temp):''}`:'—');
      const timeRange=s.time+(s.end_time?` → ${s.end_time}`:'');
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 6px;border-bottom:0.5px solid var(--border2)">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          ${iconSpan('calendar',22,'var(--text3)')}
          <div style="min-width:0">
            <div style="color:var(--text);font-size:16px;font-weight:500">${s.device_name}</div>
            <div style="color:var(--text3);font-size:13px;margin-top:2px">${fmtDays(s.days)} · ${timeRange} · <span style="color:${modeColor};font-weight:500">${action}</span></div>
          </div>
        </div>
        <span style="color:var(--text2);font-size:14px;flex-shrink:0;margin-left:10px">${event.label} ${fmtCountdown(event.when-now)}</span>
      </div>`;
    }).join('')}
  </div>`;
}

// ── Maintenance view (tap the header wrench icon) ────────────────

function renderMaintenanceView(){
  document.querySelector('#sub-header span:last-child').textContent='Maintenance';
  const el=document.getElementById('maintenance-view');
  const canComplete=currentUser.role!=='viewer';

  if(!maintenanceItems.length){
    el.innerHTML='<div style="color:var(--text2);font-size:15px;text-align:center;margin-top:40px">No maintenance reminders configured</div>';
    return;
  }

  const sorted=[...maintenanceItems].sort((a,b)=>{
    const rank=m=>m.status?.overdue?0:(m.status?.due_soon?1:2);
    return rank(a)-rank(b);
  });

  el.innerHTML=`<div style="max-width:680px;margin:0 auto;width:100%;max-height:340px;overflow:hidden">
    ${sorted.slice(0,5).map(m=>{
      const st=m.status||{};
      let statusText,statusColor;
      if(st.overdue){statusText='⚠ Overdue';statusColor='var(--err)';}
      else if(st.due_soon){statusText='Due soon';statusColor='var(--warn)';}
      else{
        statusText=m.trigger_type==='runtime_hours'?`${Math.round(st.hours_remaining)}h left`:`${Math.round(st.days_remaining)}d left`;
        statusColor='var(--text2)';
      }
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 6px;border-bottom:0.5px solid var(--border2)">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          ${iconSpan('wrench',22,statusColor)}
          <div style="min-width:0">
            <div style="color:var(--text);font-size:16px;font-weight:500">${m.name}</div>
            <div style="color:var(--text3);font-size:13px;margin-top:2px">${m.device_name||'Whole house'} · <span style="color:${statusColor};font-weight:500">${statusText}</span></div>
          </div>
        </div>
        ${canComplete?`<button data-complete="${m.id}" style="flex-shrink:0;margin-left:10px;padding:6px 12px;border-radius:6px;font-size:12px;color:var(--ok);border-color:var(--ok)">✓ Done</button>`:''}
      </div>`;
    }).join('')}
  </div>`;

  if(canComplete){
    el.querySelectorAll('[data-complete]').forEach(btn=>{
      btn.addEventListener('click',()=>completeMaintenanceKiosk(btn.dataset.complete));
    });
  }
}

async function completeMaintenanceKiosk(id){
  touch();armIdleTimer(INFO_IDLE_SECONDS);
  try{
    await fetchT(`${API}/maintenance/${id}/complete`,{method:'POST',headers:authHeaders()});
  }catch(e){}
  await refreshAll();
  if(currentSub==='maintenance')renderMaintenanceView();
}

function renderDevicesView(){
  document.querySelector('#sub-header span:last-child').textContent='All devices';
  const el=document.getElementById('devices-view');
  el.innerHTML=`<div style="max-width:640px;margin:0 auto;width:100%">
    ${devices.map(d=>{
      const dim=d._stale;
      const s=d.state||{};
      const mode=s.mode||'OFF';
      const wifi=wifiMeter(s.wifi_signal);
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:0.5px solid var(--border2);opacity:${dim?0.55:1}">
        <div style="display:flex;align-items:center;gap:10px;min-width:140px">
          <span style="width:7px;height:7px;border-radius:50%;background:${dim?'var(--gray)':'var(--ok)'};display:inline-block;flex-shrink:0"></span>
          <span style="color:var(--text);font-size:13px;font-weight:500">${d.name}</span>
        </div>
        <span style="color:${dim?'var(--text2)':MODE_COLOR[mode]};font-size:11px;font-weight:500;min-width:60px">${dim?'OFFLINE':mode}</span>
        <span style="color:var(--text2);font-size:12px;min-width:90px">${dim?'—':fmtTempCompact(s.current_temperature)}</span>
        <span style="display:flex;align-items:center;gap:6px;min-width:90px">${wifi.html}<span style="color:var(--text3);font-size:11px">${dim?'—':wifi.label}</span></span>
        <span style="color:var(--text4);font-size:10px">${d._firmware_version||'—'}</span>
      </div>`;
    }).join('')}
  </div>`;
}

// ── Footer ───────────────────────────────────────────────────

function statCell(label,value,extra,onClick){
  return `<div ${onClick?'class="footer-tappable" data-action="'+onClick+'"':''} style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
    <span style="color:var(--text3);font-size:10px;font-weight:500;letter-spacing:0.4px">${label}</span>
    <span style="color:var(--text);font-size:13px;font-weight:500;margin-left:7px">${value}</span>
    ${extra?`<span style="color:var(--text3);font-size:12px;margin-left:7px">${extra}</span>`:''}
  </div>`;
}

function renderFooter(){
  const online=devices.filter(d=>!d._stale);
  const on=online.filter(d=>(d.state?.mode||'OFF')!=='OFF');
  const totalW=online.reduce((s,d)=>s+(estWatts(d)||0),0);
  const dayCost=estCostDay(totalW).toFixed(2);
  const proj=(dayCost*30).toFixed(0);
  const el=document.getElementById('footer-stats');
  el.innerHTML=[
    statCell('ONLINE',`${online.length}/${devices.length}`,null,'devices'),
    statCell('LOAD',`${Math.round(totalW)}W`,`(${on.length} on)`),
    statCell('TODAY',`$${dayCost}`,`→ $${proj}/mo`),
    statCell('NEXT',nextScheduleText(),null,'schedules')
  ].join('');
  el.querySelectorAll('[data-action]').forEach(cell=>{
    cell.addEventListener('click',()=>{
      touch();
      const action=cell.dataset.action;
      showSub(action);
      if(action==='schedules')renderSchedulesView();
      if(action==='devices')renderDevicesView();
    });
  });
}

// ── Startup ──────────────────────────────────────────────────

async function init(){
  renderKeypad();renderDots();
  tickClock();
  clockTimer=setInterval(tickClock,1000);
  try{
    const r=await fetchT(`${API}/`);
    rootInfo=await r.json();
  }catch(e){}
}
init();
</script>
